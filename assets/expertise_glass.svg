<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>

    <!-- Skill Bar Gradients -->
    <linearGradient id="bar_grad" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="300" rx="8" fill="url(#bg_gradient)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1200" height="300" rx="8" fill="url(#console_grid)"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#1e293b" stroke-width="0.8"/>
  <text x="600" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_TELEMETRY // EXPERTISE_ANALYSIS ]
  </text>

  <!-- ================= LEFT COLUMN: SKILLS MAPPING ================= -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="550" height="225" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="20" font-family="monospace" font-size="9.5" font-weight="bold" fill="#64748b">[ COMPETENCY_BARS // STACK_METRICS ]</text>
    <line x1="15" y1="28" x2="535" y2="28" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Skill items -->
    <g transform="translate(15, 42)" font-family="monospace" font-size="10.5" font-weight="bold" fill="#8f9cae">
      <!-- Item 1 -->
      <text x="0" y="15">JAVA DEVELOPMENT</text>
      <text x="500" y="15" fill="#ffffff" text-anchor="end">90%</text>
      <rect x="160" y="6" width="320" height="8" rx="2" fill="#1e293b"/>
      <rect x="160" y="6" width="288" height="8" rx="2" fill="url(#bar_grad)"/>

      <!-- Item 2 -->
      <text x="0" y="42">SQL DATABASES</text>
      <text x="500" y="42" fill="#ffffff" text-anchor="end">85%</text>
      <rect x="160" y="33" width="320" height="8" rx="2" fill="#1e293b"/>
      <rect x="160" y="33" width="272" height="8" rx="2" fill="url(#bar_grad)"/>

      <!-- Item 3 -->
      <text x="0" y="69">TEST AUTOMATION (E2E)</text>
      <text x="500" y="69" fill="#ffffff" text-anchor="end">80%</text>
      <rect x="160" y="60" width="320" height="8" rx="2" fill="#1e293b"/>
      <rect x="160" y="60" width="256" height="8" rx="2" fill="url(#bar_grad)"/>

      <!-- Item 4 -->
      <text x="0" y="96">API &amp; BACKEND TESTING</text>
      <text x="500" y="96" fill="#ffffff" text-anchor="end">80%</text>
      <rect x="160" y="87" width="320" height="8" rx="2" fill="#1e293b"/>
      <rect x="160" y="87" width="256" height="8" rx="2" fill="url(#bar_grad)"/>

      <!-- Item 5 -->
      <text x="0" y="123">PYTHON SCRIPTING</text>
      <text x="500" y="123" fill="#ffffff" text-anchor="end">80%</text>
      <rect x="160" y="114" width="320" height="8" rx="2" fill="#1e293b"/>
      <rect x="160" y="114" width="256" height="8" rx="2" fill="url(#bar_grad)"/>

      <!-- Item 6 -->
      <text x="0" y="150">CI/CD PIPELINES</text>
      <text x="500" y="150" fill="#ffffff" text-anchor="end">80%</text>
      <rect x="160" y="141" width="320" height="8" rx="2" fill="#1e293b"/>
      <rect x="160" y="141" width="256" height="8" rx="2" fill="url(#bar_grad)"/>
    </g>
    
    <text x="15" y="212" font-family="monospace" font-size="9" fill="#64748b">AUTO_UPDATE: OFF // CALIBRATED: VERIFIED</text>
  </g>

  <!-- ================= RIGHT COLUMN: CERT & RESEARCH ================= -->
  <!-- 1. Certification (ISTQB) -->
  <g transform="translate(605, 50)">
    <rect x="0" y="0" width="565" height="105" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="20" font-family="monospace" font-size="9.5" font-weight="bold" fill="#64748b">[ VERIFIED_CREDENTIALS ]</text>
    <line x1="15" y1="28" x2="545" y2="28" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Certified block -->
    <rect x="15" y="40" width="535" height="52" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
    <text x="30" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">ISTQB® Certified Tester</text>
    <text x="30" y="76" font-family="monospace" font-size="10" fill="#10b981" font-weight="bold">Foundation Level (CTFL) — ID: CERT_992837</text>
    <text x="520" y="68" font-family="monospace" font-size="9.5" fill="#64748b" text-anchor="end">[ISSUER: ISTQB]</text>
  </g>

  <!-- 2. Currently Exploring -->
  <g transform="translate(605, 170)">
    <rect x="0" y="0" width="565" height="105" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="20" font-family="monospace" font-size="9.5" font-weight="bold" fill="#64748b">[ RESEARCH_LABS // FUTURE_TECH ]</text>
    <line x1="15" y1="28" x2="545" y2="28" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Chips (Flat, clean, monospaced tech tags) -->
    <g transform="translate(15, 42)" font-family="monospace" font-size="9.5" font-weight="bold">
      <!-- Row 1 -->
      <rect x="0" y="0" width="95" height="22" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="47.5" y="14" fill="#38bdf8" text-anchor="middle">AI_Testing</text>

      <rect x="105" y="0" width="115" height="22" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="162.5" y="14" fill="#38bdf8" text-anchor="middle">Agentic_QA</text>

      <rect x="230" y="0" width="115" height="22" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="287.5" y="14" fill="#38bdf8" text-anchor="middle">MCP_Protocol</text>

      <rect x="355" y="0" width="115" height="22" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="412.5" y="14" fill="#38bdf8" text-anchor="middle">RAG_Pipelines</text>

      <!-- Row 2 -->
      <rect x="0" y="30" width="125" height="22" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="62.5" y="44" fill="#38bdf8" text-anchor="middle">LLM_Integration</text>

      <rect x="135" y="30" width="150" height="22" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="210" y="44" fill="#38bdf8" text-anchor="middle">Playwright_Advanced</text>

      <rect x="295" y="30" width="165" height="22" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="377.5" y="44" fill="#38bdf8" text-anchor="middle">GitHub_Actions_CI</text>
    </g>
  </g>
</svg>
