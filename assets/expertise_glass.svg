<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="280" rx="16" fill="url(#bg_gradient)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="1200" height="280" rx="16" fill="url(#console_grid)"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_TELEMETRY // EXPERTISE_ANALYSIS ]
  </text>

  <!-- ================= LEFT COLUMN: DONUT CHARTS ================= -->
  <g transform="translate(30, 48)">
    <rect x="0" y="0" width="550" height="205" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">&gt; COMPETENCY_ALLOCATION</text>
    <line x1="20" y1="28" x2="530" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <!-- Donut 1: UI Automation (80%) -->
    <g transform="translate(45, 45)">
      <circle cx="50" cy="50" r="36" stroke="#161b22" stroke-width="7" fill="none"/>
      <circle cx="50" cy="50" r="36" stroke="#ff5e62" stroke-width="7" fill="none" stroke-dasharray="226" stroke-dashoffset="45"/>
      <text x="50" y="54" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">80%</text>
      <text x="50" y="105" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#8b949e" text-anchor="middle">UI Automation</text>
    </g>

    <!-- Donut 2: API Testing (80%) -->
    <g transform="translate(210, 45)">
      <circle cx="50" cy="50" r="36" stroke="#161b22" stroke-width="7" fill="none"/>
      <circle cx="50" cy="50" r="36" stroke="#0070f3" stroke-width="7" fill="none" stroke-dasharray="226" stroke-dashoffset="45"/>
      <text x="50" y="54" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">80%</text>
      <text x="50" y="105" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#8b949e" text-anchor="middle">API Testing</text>
    </g>

    <!-- Donut 3: Backend & CI/CD (85%) -->
    <g transform="translate(375, 45)">
      <circle cx="50" cy="50" r="36" stroke="#161b22" stroke-width="7" fill="none"/>
      <circle cx="50" cy="50" r="36" stroke="#10b981" stroke-width="7" fill="none" stroke-dasharray="226" stroke-dashoffset="34"/>
      <text x="50" y="54" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">85%</text>
      <text x="50" y="105" font-family="system-ui, sans-serif" font-weight="bold" font-size="10.5" fill="#8b949e" text-anchor="middle">Backend &amp; CI/CD</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: CERT & RESEARCH ================= -->
  <!-- 1. Certification (ISTQB) -->
  <g transform="translate(605, 48)">
    <rect x="0" y="0" width="565" height="95" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">&gt; CERTIFICATIONS</text>
    <line x1="20" y1="28" x2="545" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <!-- Certified block -->
    <rect x="20" y="38" width="525" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="35" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff">ISTQB® CTFL Certified</text>
    <text x="180" y="64" font-family="monospace" font-size="9.5" fill="#10b981" font-weight="bold">[ID: CERT_992837]</text>
    <text x="505" y="64" font-family="monospace" font-size="9.5" fill="#64748b" text-anchor="end">[ISSUER: ISTQB]</text>
  </g>

  <!-- 2. Currently Exploring -->
  <g transform="translate(605, 158)">
    <rect x="0" y="0" width="565" height="95" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">&gt; ACTIVE_RESEARCH</text>
    <line x1="20" y1="28" x2="545" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <!-- Chips (Flat, clean, rounded tags) -->
    <g transform="translate(20, 38)" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="85" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="42.5" y="13" fill="#8b949e" text-anchor="middle">AI Testing</text>
      <!-- Tag 2 -->
      <rect x="95" y="0" width="105" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="147.5" y="13" fill="#8b949e" text-anchor="middle">Agentic QA</text>
      <!-- Tag 3 -->
      <rect x="210" y="0" width="115" height="20" rx="10" fill="#f0f9ff" stroke="#b3f0ff" stroke-width="0.8"/>
      <text x="267.5" y="13" fill="#0070f3" text-anchor="middle">MCP Protocol</text>
      <!-- Tag 4 -->
      <rect x="335" y="0" width="115" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="392.5" y="13" fill="#8b949e" text-anchor="middle">RAG Pipelines</text>

      <!-- Row 2 -->
      <rect x="0" y="28" width="125" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="62.5" y="41" fill="#8b949e" text-anchor="middle">LLM Integration</text>
      <rect x="135" y="28" width="145" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="207.5" y="41" fill="#8b949e" text-anchor="middle">Playwright Advanced</text>
      <rect x="290" y="28" width="140" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <text x="360" y="41" fill="#10b981" text-anchor="middle">GitHub Actions CI</text>
    </g>
  </g>
</svg>
