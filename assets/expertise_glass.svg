<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="widget_sheen" x1="0" y1="0" x2="550" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Skill Bar Gradients -->
    <linearGradient id="bar_blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="bar_green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar_orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ff6b3b"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="380" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="600" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_TELEMETRY // EXPERTISE_ANALYSIS ]
  </text>

  <!-- ================= LEFT COLUMN: EXPERTISE DONUT WIDGET ================= -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="560" height="300" rx="12" fill="url(#widget_sheen)" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <text x="25" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">&gt; DISTRIBUTION_SHARE // QA_FOCUS</text>
    <line x1="25" y1="38" x2="535" y2="38" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Donut Graph (Clean sharp SVG circle arcs matching reference image donut) -->
    <!-- Donut background circle -->
    <circle cx="160" cy="165" r="70" stroke="#f1f5f9" stroke-width="26" fill="none"/>
    
    <!-- Orange segment (120deg -> ~33%) -->
    <circle cx="160" cy="165" r="70" stroke="#ff7b5c" stroke-width="26" fill="none" stroke-dasharray="146 440" stroke-dashoffset="0"/>
    
    <!-- Blue segment (130deg -> ~36%) -->
    <circle cx="160" cy="165" r="70" stroke="#00d2ff" stroke-width="26" fill="none" stroke-dasharray="158 440" stroke-dashoffset="-146"/>
    
    <!-- Purple segment (110deg -> ~31%) -->
    <circle cx="160" cy="165" r="70" stroke="#9d4edd" stroke-width="26" fill="none" stroke-dasharray="136 440" stroke-dashoffset="-304"/>

    <!-- Center text label inside donut -->
    <text x="160" y="162" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#0f172a" text-anchor="middle">QA Ops</text>
    <text x="160" y="177" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">100%_ALLOC</text>

    <!-- Legend List -->
    <g transform="translate(320, 80)" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">
      <!-- Item 1 -->
      <rect x="0" y="5" width="12" height="12" rx="2" fill="#00d2ff"/>
      <text x="25" y="16">API &amp; Integration Testing</text>
      <text x="25" y="32" font-family="monospace" font-size="10" fill="#64748b">Karate / REST Assured // 35%</text>

      <!-- Item 2 -->
      <rect x="0" y="55" width="12" height="12" rx="2" fill="#ff7b5c"/>
      <text x="25" y="66">UI Automation Frameworks</text>
      <text x="25" y="82" font-family="monospace" font-size="10" fill="#64748b">Selenium / Playwright // 35%</text>

      <!-- Item 3 -->
      <rect x="0" y="105" width="12" height="12" rx="2" fill="#9d4edd"/>
      <text x="25" y="116">Java Core / CI Pipelines / SQL</text>
      <text x="25" y="132" font-family="monospace" font-size="10" fill="#64748b">Maven / Jenkins / Docker // 30%</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: CORE CAPABILITIES ================= -->
  <!-- 1. Certification (ISTQB) -->
  <g transform="translate(610, 55)">
    <rect x="0" y="0" width="560" height="135" rx="12" fill="url(#widget_sheen)" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">&gt; VERIFIED_CREDENTIALS</text>
    <line x1="25" y1="38" x2="535" y2="38" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Certified block -->
    <rect x="25" y="52" width="510" height="62" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="55" cy="83" r="18" fill="#fff9eb"/>
    <text x="55" y="88" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🏅</text>
    
    <text x="88" y="76" font-family="system-ui, sans-serif" font-size="14.5" font-weight="900" fill="#0f172a">ISTQB® Certified Tester</text>
    <text x="88" y="94" font-family="monospace" font-size="10.5" fill="#d97706" font-weight="bold">Foundation Level (CTFL) — ID: CERT_992837</text>
  </g>

  <!-- 2. Currently Exploring -->
  <g transform="translate(610, 210)">
    <rect x="0" y="0" width="560" height="145" rx="12" fill="url(#widget_sheen)" stroke="#e2e8f0" stroke-width="1.2"/>
    
    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">&gt; RESEARCH_LABS // FUTURE_TECH</text>
    <line x1="25" y1="38" x2="535" y2="38" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Chips (Flat, clean, rounded tags) -->
    <g transform="translate(25, 52)" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="115" height="24" rx="12" fill="#fff5ec" stroke="#ffe2cc" stroke-width="0.8"/>
      <text x="57" y="16" fill="#ff7b5c" text-anchor="middle">AI_Testing</text>
      <!-- Tag 2 -->
      <rect x="125" y="0" width="125" height="24" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8"/>
      <text x="187" y="16" fill="#9d4edd" text-anchor="middle">Agentic_QA_Engines</text>
      <!-- Tag 3 -->
      <rect x="260" y="0" width="115" height="24" rx="12" fill="#f0f9ff" stroke="#b3f0ff" stroke-width="0.8"/>
      <text x="317" y="16" fill="#00a8ff" text-anchor="middle">MCP_Protocol</text>
      <!-- Tag 4 -->
      <rect x="385" y="0" width="120" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <text x="445" y="16" fill="#10b981" text-anchor="middle">RAG_Pipelines</text>

      <!-- Row 2 -->
      <rect x="0" y="36" width="135" height="24" rx="12" fill="#f0f9ff" stroke="#b3f0ff" stroke-width="0.8"/>
      <text x="67" y="52" fill="#00a8ff" text-anchor="middle">LLM_QA_Integration</text>
      <rect x="145" y="36" width="165" height="24" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.8"/>
      <text x="227" y="52" fill="#9d4edd" text-anchor="middle">Playwright_Advanced</text>
      <rect x="320" y="36" width="185" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
      <text x="412" y="52" fill="#10b981" text-anchor="middle">GitHub_Actions_CI</text>
    </g>
  </g>
</svg>
