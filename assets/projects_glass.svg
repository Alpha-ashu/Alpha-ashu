  <rect x="46"  y="168" width="46" height="20" rx="10" fill="rgba(237,139,0,0.25)"  stroke="rgba(237,139,0,0.5)"  stroke-width="0.8"/>
  <text x="69"  y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#F5A623">Java</text>
  <rect x="98"  y="168" width="54" height="20" rx="10" fill="rgba(10,116,218,0.25)" stroke="rgba(10,116,218,0.5)" stroke-width="0.8"/>
  <text x="125" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#58A6FF">Karate</text>
  <rect x="158" y="168" width="54" height="20" rx="10" fill="rgba(55,118,171,0.25)" stroke="rgba(55,118,171,0.5)" stroke-width="0.8"/>
  <text x="185" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#6FC3FF">Python</text>
  <rect x="218" y="168" width="58" height="20" rx="10" fill="rgba(210,73,57,0.25)"  stroke="rgba(210,73,57,0.5)"  stroke-width="0.8"/>
  <text x="247" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#FF7B6B">Jenkins</text>
  <!-- Description -->
  <foreignObject x="44" y="196" width="237" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',sans-serif;font-size:11px;color:rgba(201,209,217,0.9);line-height:1.55;">
      Production-grade REST API comparison engine for healthcare migration. Python JSON normalisation + automated daily regression with thousands of record checks per CI run.
    </div>
  </foreignObject>
  <!-- Bottom tag -->
  <rect x="72" y="354" width="180" height="20" rx="10" fill="rgba(10,116,218,0.15)" stroke="rgba(88,166,255,0.3)" stroke-width="0.8"/>
  <text x="162" y="368" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#58A6FF">Healthcare · API · CI/CD</text>

