      <rect x="0" y="0" width="70" height="18" rx="3" fill="#060a13" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="35" y="12" font-family="monospace" font-size="9" fill="#58a6ff" text-anchor="middle">TypeScript</text>
      <rect x="76" y="0" width="72" height="18" rx="3" fill="#060a13" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="112" y="12" font-family="monospace" font-size="9" fill="#00f5a0" text-anchor="middle">Playwright</text>
      <rect x="154" y="0" width="50" height="18" rx="3" fill="#060a13" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="179" y="12" font-family="monospace" font-size="9" fill="#00f2fe" text-anchor="middle">CI/CD</text>
    </g>

    <text x="20" y="136" font-family="system-ui, sans-serif" font-size="11.5" fill="#8f9cae">
