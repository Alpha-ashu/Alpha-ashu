<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="space_bg" x1="600" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.05"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon_glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="title_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect width="1200" height="420" fill="url(#space_bg)"/>
  <rect width="1200" height="420" fill="url(#console_grid)"/>

  <!-- 2. SECTION HEADER -->
  <line x1="50" y1="40" x2="1150" y2="40" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.15"/>
  <text x="600" y="32" font-family="monospace" font-size="11" fill="#00f2fe" text-anchor="middle" letter-spacing="4" filter="url(#title_glow)">
    [ SYSTEM_SHOWCASE // ENTERPRISE_REPOSITORIES ]
  </text>
  <line x1="570" y1="40" x2="630" y2="40" stroke="#00f2fe" stroke-width="2"/>

  <!-- 3. PROJECT CARD GRID (4 Cards) -->

  <!-- ================= CARD 1: KARATE API FRAMEWORK ================= -->
  <g transform="translate(25, 70)">
    <!-- Base Glass Box -->
    <rect x="0" y="0" width="270" height="320" rx="8" fill="#070c18" fill-opacity="0.6" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="270" height="24" rx="8" fill="#030712" fill-opacity="0.9" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="15" cy="12" r="3" fill="#ff5f56"/>
    <circle cx="25" cy="12" r="3" fill="#ffbd2e"/>
    <circle cx="35" cy="12" r="3" fill="#27c93f"/>
    <text x="255" y="15" font-family="monospace" font-size="8" fill="#00f2fe" text-anchor="end">[PORT: 8080]</text>
    
    <!-- Title -->
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">Karate API Framework</text>
    <text x="20" y="72" font-family="monospace" font-size="9" fill="#00f2fe">REST ENGINE // DATA SYNC</text>

    <!-- Visual divider -->
    <line x1="20" y1="82" x2="250" y2="82" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Badges -->
    <g transform="translate(20, 92)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="46" height="18" rx="4" fill="#0e172a" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="23" y="12" font-family="monospace" font-size="9" fill="#58a6ff" text-anchor="middle">Java</text>
      <!-- Tag 2 -->
      <rect x="52" y="0" width="56" height="18" rx="4" fill="#0e172a" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="80" y="12" font-family="monospace" font-size="9" fill="#00f2fe" text-anchor="middle">Karate</text>
      <!-- Tag 3 -->
      <rect x="114" y="0" width="56" height="18" rx="4" fill="#0e172a" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="142" y="12" font-family="monospace" font-size="9" fill="#00f5a0" text-anchor="middle">Python</text>
      <!-- Tag 4 -->
      <rect x="176" y="0" width="60" height="18" rx="4" fill="#0e172a" stroke="#9d4edd" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="206" y="12" font-family="monospace" font-size="9" fill="#9d4edd" text-anchor="middle">Jenkins</text>
    </g>

    <!-- Description -->
    <text x="20" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#8f9cae">
      <tspan x="20" dy="0">Production-grade REST API</tspan>
      <tspan x="20" dy="18">comparison engine designed for</tspan>
      <tspan x="20" dy="18">healthcare migration. Python</tspan>
      <tspan x="20" dy="18">normalisation engine handles</tspan>
      <tspan x="20" dy="18">daily validation of thousands</tspan>
      <tspan x="20" dy="18">of critical data records.</tspan>
    </text>

    <!-- Graph telemetry graphic -->
    <path d="M 20 280 L 70 265 L 120 275 L 170 255 L 220 260 L 250 240" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M 20 280 L 70 265 L 120 275 L 170 255 L 220 260 L 250 240 L 250 295 L 20 295 Z" fill="url(#space_bg)" opacity="0.15"/>
    <circle cx="250" cy="240" r="3.5" fill="#00f2fe" filter="url(#neon_glow_cyan)"/>

    <!-- Bottom frame line -->
    <line x1="20" y1="305" x2="250" y2="305" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- ================= CARD 2: SELENIUM FRAMEWORK ================= -->
  <g transform="translate(315, 70)">
    <rect x="0" y="0" width="270" height="320" rx="8" fill="#070c18" fill-opacity="0.6" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="270" height="24" rx="8" fill="#030712" fill-opacity="0.9" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="15" cy="12" r="3" fill="#ff5f56"/>
    <circle cx="25" cy="12" r="3" fill="#ffbd2e"/>
    <circle cx="35" cy="12" r="3" fill="#27c93f"/>
    <text x="255" y="15" font-family="monospace" font-size="8" fill="#00f5a0" text-anchor="end">[PORT: 4444]</text>
    
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">Selenium Automation</text>
    <text x="20" y="72" font-family="monospace" font-size="9" fill="#00f5a0">HYBRID // DATA DRIVEN</text>

    <line x1="20" y1="82" x2="250" y2="82" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.2"/>

