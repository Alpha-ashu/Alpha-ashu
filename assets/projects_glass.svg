  <text x="1027" y="120" text-anchor="middle" font-size="26" font-family="'Segoe UI Emoji',system-ui">&#x1F916;</text>
  <text x="1027" y="148" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">AI-Powered QA Research</text>
  <line x1="915" y1="158" x2="1140" y2="158" stroke="rgba(255,111,0,0.2)" stroke-width="0.6"/>
  <rect x="901" y="168" width="54" height="20" rx="10" fill="rgba(55,118,171,0.25)" stroke="rgba(55,118,171,0.5)" stroke-width="0.8"/>
  <text x="928" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#6FC3FF">Python</text>
  <rect x="961" y="168" width="52" height="20" rx="10" fill="rgba(255,111,0,0.25)" stroke="rgba(255,111,0,0.5)" stroke-width="0.8"/>
  <text x="987" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#FFA040">AI/ML</text>
  <rect x="1019" y="168" width="42" height="20" rx="10" fill="rgba(16,163,127,0.25)" stroke="rgba(16,163,127,0.5)" stroke-width="0.8"/>
