<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="320" rx="8" fill="url(#bg_gradient)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1200" height="320" rx="8" fill="url(#console_grid)"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#1e293b" stroke-width="0.8"/>
  <text x="600" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_SHOWCASE // ENTERPRISE_REPOSITORIES ]
  </text>

  <!-- ================= CARD 1: KARATE API FRAMEWORK ================= -->
  <g transform="translate(25, 55)">
    <!-- Base Card Frame -->
    <rect x="0" y="0" width="270" height="240" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Title Section -->
    <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Karate API Framework</text>
    <text x="15" y="44" font-family="monospace" font-size="9" font-weight="bold" fill="#38bdf8">ENGINE: REST_API // DATA_SYNC</text>

    <!-- Divider -->
    <line x1="15" y1="52" x2="255" y2="52" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Description -->
    <text x="15" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">
      <tspan x="15" dy="0">Production-grade comparison engine</tspan>
      <tspan x="15" dy="16">for healthcare legacy migration.</tspan>
      <tspan x="15" dy="16">Python utilities normalise fields</tspan>
      <tspan x="15" dy="16">before automated Jenkins checks.</tspan>
    </text>

    <!-- Console Output Simulation (Realistic console details) -->
    <g transform="translate(15, 138)">
      <rect x="0" y="0" width="240" height="82" rx="4" fill="#000000" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#10b981">Console:~/suite$ run --daily</text>
      <text x="12" y="30" font-family="monospace" font-size="9" fill="#8f9cae">Records Verified: 2450 / 2450</text>
      <text x="12" y="44" font-family="monospace" font-size="9" fill="#8f9cae">Status: [ SUCCESS ]  Dur: 142s</text>
      <text x="12" y="58" font-family="monospace" font-size="9" fill="#64748b">Stack: Java 17 | Karate | Py</text>
      
      <!-- Progress Bar Inside Console -->
      <rect x="12" y="68" width="216" height="4" rx="2" fill="#1e293b"/>
      <rect x="12" y="68" width="216" height="4" rx="2" fill="#10b981"/>
    </g>
  </g>

  <!-- ================= CARD 2: SELENIUM FRAMEWORK ================= -->
  <g transform="translate(315, 55)">
    <rect x="0" y="0" width="270" height="240" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    
    <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Selenium Automation</text>
    <text x="15" y="44" font-family="monospace" font-size="9" font-weight="bold" fill="#38bdf8">ENGINE: UI_SELENIUM // HYBRID</text>

    <line x1="15" y1="52" x2="255" y2="52" stroke="#1e293b" stroke-width="0.8"/>

    <text x="15" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">
      <tspan x="15" dy="0">Enterprise POM/Data-Driven suite.</tspan>
      <tspan x="15" dy="16">Automating critical payments,</tspan>
      <tspan x="15" dy="16">shopping carts, &amp; security flows.</tspan>
      <tspan x="15" dy="16">Features auto-screenshot utility.</tspan>
    </text>

    <g transform="translate(15, 138)">
      <rect x="0" y="0" width="240" height="82" rx="4" fill="#000000" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#10b981">Console:~/selenium$ mvn test</text>
      <text x="12" y="30" font-family="monospace" font-size="9" fill="#8f9cae">Scenarios Run: 180 | Failures: 0</text>
      <text x="12" y="44" font-family="monospace" font-size="9" fill="#8f9cae">Build: [ SUCCESS ]   Retries: 1</text>
      <text x="12" y="58" font-family="monospace" font-size="9" fill="#64748b">Stack: Java 17 | TestNG | Maven</text>
      
      <rect x="12" y="68" width="216" height="4" rx="2" fill="#1e293b"/>
      <rect x="12" y="68" width="216" height="4" rx="2" fill="#10b981"/>
    </g>
  </g>

  <!-- ================= CARD 3: PLAYWRIGHT FRAMEWORK ================= -->
  <g transform="translate(605, 55)">
    <rect x="0" y="0" width="270" height="240" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    
    <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Playwright Framework</text>
    <text x="15" y="44" font-family="monospace" font-size="9" font-weight="bold" fill="#38bdf8">ENGINE: UI_PLAYWRIGHT // TS</text>

    <line x1="15" y1="52" x2="255" y2="52" stroke="#1e293b" stroke-width="0.8"/>

    <text x="15" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      <tspan x="15" dy="0">Cross-browser test framework with</tspan>
      <tspan x="15" dy="16">highly parallel test runner execution</tspan>
      <tspan x="15" dy="16">targeting Chromium/WebKit engines</tspan>
      <tspan x="15" dy="16">for modern web dashboard interfaces.</tspan>
    </text>

    <g transform="translate(15, 138)">
      <rect x="0" y="0" width="240" height="82" rx="4" fill="#000000" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#10b981">Console:~/pw$ npx playwright test</text>
      <text x="12" y="30" font-family="monospace" font-size="9" fill="#8f9cae">Workers: 4 | Passed: 124 / 124</text>
      <text x="12" y="44" font-family="monospace" font-size="9" fill="#8f9cae">Report: HTML | Mode: Headless</text>
      <text x="12" y="58" font-family="monospace" font-size="9" fill="#64748b">Stack: TypeScript | Playwright</text>
      
      <rect x="12" y="68" width="216" height="4" rx="2" fill="#1e293b"/>
      <rect x="12" y="68" width="216" height="4" rx="2" fill="#10b981"/>
    </g>
  </g>

  <!-- ================= CARD 4: AI QA RESEARCH ================= -->
  <g transform="translate(895, 55)">
    <rect x="0" y="0" width="280" height="240" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    
    <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">AI-Powered QA Research</text>
    <text x="15" y="44" font-family="monospace" font-size="9" font-weight="bold" fill="#38bdf8">ENGINE: AGENTIC // LLM // RAG</text>

    <line x1="15" y1="52" x2="265" y2="52" stroke="#1e293b" stroke-width="0.8"/>

    <text x="15" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      <tspan x="15" dy="0">Exploring AI-driven test script</tspan>
      <tspan x="15" dy="16">synthesis, Model Context Protocol</tspan>
      <tspan x="15" dy="16">(MCP) server architectures, and RAG</tspan>
      <tspan x="15" dy="16">pipelines for advanced test generation.</tspan>
    </text>

    <g transform="translate(15, 138)">
      <rect x="0" y="0" width="250" height="82" rx="4" fill="#000000" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="16" font-family="monospace" font-size="9" fill="#10b981">Console:~/ai$ python agent_run.py</text>
      <text x="12" y="30" font-family="monospace" font-size="9" fill="#8f9cae">Synthesised Cases: 52 | Acc: 94%</text>
      <text x="12" y="44" font-family="monospace" font-size="9" fill="#8f9cae">Model: GPT-4o // MCP: Enabled</text>
      <text x="12" y="58" font-family="monospace" font-size="9" fill="#64748b">Stack: Python | OpenAI | RAG</text>
      
      <rect x="12" y="68" width="226" height="4" rx="2" fill="#1e293b"/>
      <rect x="12" y="68" width="135" height="4" rx="2" fill="#38bdf8"/>
    </g>
  </g>
</svg>
