<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>

    <!-- Specular Sheen Gradient for Card Glass -->
    <linearGradient id="glass_sheen" x1="0" y1="0" x2="270" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Header line gradient -->
    <linearGradient id="hdrLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00f5a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="420" fill="url(#bg_gradient)"/>
  <rect width="1200" height="420" fill="url(#console_grid)"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="40" x2="1150" y2="40" stroke="url(#hdrLine)" stroke-width="0.8"/>
  <text x="600" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#00f2fe" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_SHOWCASE // ENTERPRISE_REPOSITORIES ]
  </text>

  <!-- ================= CARD 1: KARATE API FRAMEWORK ================= -->
  <g transform="translate(25, 70)">
    <!-- Base Glass Box -->
    <rect x="0" y="0" width="270" height="320" rx="6" fill="#0b1120" fill-opacity="0.8" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="270" height="320" rx="6" fill="url(#glass_sheen)"/>
    
    <!-- Top Console Header Bar -->
    <rect x="0" y="0" width="270" height="24" rx="6" fill="#030712" fill-opacity="0.9" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="15" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="25" cy="12" r="3.5" fill="#f59e0b"/>
    <circle cx="35" cy="12" r="3.5" fill="#10b981"/>
    <text x="255" y="15" font-family="monospace" font-size="8" font-weight="bold" fill="#00f2fe" text-anchor="end">[PORT: 8080]</text>
    
    <!-- Content -->
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">Karate API Framework</text>
    <text x="20" y="71" font-family="monospace" font-size="9" fill="#00f2fe" letter-spacing="1">REST ENGINE // DATA SYNC</text>

    <!-- Visual divider -->
    <line x1="20" y1="81" x2="250" y2="81" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Badges Grid -->
    <g transform="translate(20, 91)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="46" height="18" rx="3" fill="#060a13" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="23" y="12" font-family="monospace" font-size="9" fill="#58a6ff" text-anchor="middle">Java</text>
      <!-- Tag 2 -->
      <rect x="52" y="0" width="56" height="18" rx="3" fill="#060a13" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="80" y="12" font-family="monospace" font-size="9" fill="#00f2fe" text-anchor="middle">Karate</text>
      <!-- Tag 3 -->
      <rect x="114" y="0" width="56" height="18" rx="3" fill="#060a13" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="142" y="12" font-family="monospace" font-size="9" fill="#00f5a0" text-anchor="middle">Python</text>
      <!-- Tag 4 -->
      <rect x="176" y="0" width="60" height="18" rx="3" fill="#060a13" stroke="#9d4edd" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="206" y="12" font-family="monospace" font-size="9" fill="#9d4edd" text-anchor="middle">Jenkins</text>
    </g>

    <!-- Description -->
    <text x="20" y="136" font-family="system-ui, sans-serif" font-size="11.5" fill="#8f9cae">
      <tspan x="20" dy="0">Production-grade REST API</tspan>
      <tspan x="20" dy="18">comparison engine designed for</tspan>
      <tspan x="20" dy="18">healthcare migration. Python</tspan>
      <tspan x="20" dy="18">normalisation engine handles</tspan>
      <tspan x="20" dy="18">daily validation of thousands</tspan>
      <tspan x="20" dy="18">of critical data records.</tspan>
    </text>

    <!-- Telemetry Graph Line (No glow, sharp SVG line) -->
    <path d="M 20 280 L 70 265 L 120 275 L 170 255 L 220 260 L 250 240" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="247" y="237" width="6" height="6" fill="#00f2fe"/>

    <!-- Bottom border segment -->
    <line x1="20" y1="305" x2="250" y2="305" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- ================= CARD 2: SELENIUM FRAMEWORK ================= -->
  <g transform="translate(315, 70)">
    <rect x="0" y="0" width="270" height="320" rx="6" fill="#0b1120" fill-opacity="0.8" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="270" height="320" rx="6" fill="url(#glass_sheen)"/>
    
    <rect x="0" y="0" width="270" height="24" rx="6" fill="#030712" fill-opacity="0.9" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="15" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="25" cy="12" r="3.5" fill="#f59e0b"/>
