    <text x="20" y="71" font-family="monospace" font-size="9" fill="#58a6ff" letter-spacing="1">ASYNC RUNNER // SHARDED</text>

    <line x1="20" y1="81" x2="250" y2="81" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.2"/>

