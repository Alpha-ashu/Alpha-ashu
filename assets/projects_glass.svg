<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>

    <!-- Chart Gradients -->
    <linearGradient id="chart_orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5e62" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5e62" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chart_green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chart_blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chart_purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="320" rx="16" fill="url(#bg_gradient)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="16" fill="url(#console_grid)"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_SHOWCASE // ENTERPRISE_REPOSITORIES ]
  </text>

  <!-- ================= CARD 1: KARATE API FRAMEWORK ================= -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="270" height="240" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- Title Section -->
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Karate API Framework</text>
    <text x="20" y="48" font-family="monospace" font-size="9" font-weight="bold" fill="#ff5e62">REST ENGINE // DATA SYNC</text>

    <!-- Divider -->
    <line x1="20" y1="58" x2="250" y2="58" stroke="#30363d" stroke-width="0.8"/>

    <!-- Tags -->
    <g transform="translate(20, 68)" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">
      <rect x="0" y="0" width="42" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="21" y="12" fill="#8b949e" text-anchor="middle">Java</text>
      
      <rect x="47" y="0" width="54" height="18" rx="9" fill="#fff5ec" stroke="#ffe2cc" stroke-width="0.6"/>
      <text x="74" y="12" fill="#ff7b5c" text-anchor="middle">Karate</text>

      <rect x="106" y="0" width="54" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="133" y="12" fill="#8b949e" text-anchor="middle">Python</text>
    </g>

    <!-- Description -->
    <text x="20" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#8b949e">
      <tspan x="20" dy="0">API comparison validation engine</tspan>
      <tspan x="20" dy="16">for legacy data migration. Python</tspan>
      <tspan x="20" dy="16">normalisation utilities check 1000s</tspan>
      <tspan x="20" dy="16">of records daily via Jenkins CI.</tspan>
    </text>

    <!-- Wave Graph (Realistic smooth curve) -->
    <path d="M 2 238 L 2 205 Q 40 185 80 205 T 160 175 T 240 180 T 268 150 L 268 238 Z" fill="url(#chart_orange)"/>
    <path d="M 2 205 Q 40 185 80 205 T 160 175 T 240 180 T 268 150" fill="none" stroke="#ff5e62" stroke-width="2"/>
    <circle cx="268" cy="150" r="3.5" fill="#ff5e62"/>
  </g>

  <!-- ================= CARD 2: SELENIUM FRAMEWORK ================= -->
  <g transform="translate(315, 55)">
    <rect x="0" y="0" width="270" height="240" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Selenium Automation</text>
    <text x="20" y="48" font-family="monospace" font-size="9" font-weight="bold" fill="#10b981">HYBRID // DATA DRIVEN</text>

    <line x1="20" y1="58" x2="250" y2="58" stroke="#30363d" stroke-width="0.8"/>

    <g transform="translate(20, 68)" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">
      <rect x="0" y="0" width="42" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="21" y="12" fill="#8b949e" text-anchor="middle">Java</text>
      
      <rect x="47" y="0" width="62" height="18" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.6"/>
      <text x="78" y="12" fill="#10b981" text-anchor="middle">Selenium</text>

      <rect x="114" y="0" width="52" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="140" y="12" fill="#8b949e" text-anchor="middle">TestNG</text>
    </g>

    <text x="20" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#8b949e">
      <tspan x="20" dy="0">POM/Data-Driven UI Automation</tspan>
      <tspan x="20" dy="16">suite validating end-to-end checkout</tspan>
      <tspan x="20" dy="16">and cart modules. Custom failures</tspan>
      <tspan x="20" dy="16">screenshot &amp; retry architecture.</tspan>
    </text>

    <path d="M 2 238 L 2 210 Q 50 230 90 190 T 170 200 T 250 170 T 268 185 L 268 238 Z" fill="url(#chart_green)"/>
    <path d="M 2 210 Q 50 230 90 190 T 170 200 T 250 170 T 268 185" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="250" cy="170" r="3.5" fill="#10b981"/>
  </g>

  <!-- ================= CARD 3: PLAYWRIGHT FRAMEWORK ================= -->
  <g transform="translate(605, 55)">
    <rect x="0" y="0" width="270" height="240" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Playwright Framework</text>
    <text x="20" y="48" font-family="monospace" font-size="9" font-weight="bold" fill="#0070f3">ASYNC RUNNER // SHARDED</text>

    <line x1="20" y1="58" x2="250" y2="58" stroke="#30363d" stroke-width="0.8"/>

    <g transform="translate(20, 68)" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">
      <rect x="0" y="0" width="68" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="34" y="12" fill="#8b949e" text-anchor="middle">TypeScript</text>
      
      <rect x="73" y="0" width="70" height="18" rx="9" fill="#f0f9ff" stroke="#b3f0ff" stroke-width="0.6"/>
      <text x="108" y="12" fill="#0070f3" text-anchor="middle">Playwright</text>

      <rect x="148" y="0" width="46" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="171" y="12" fill="#8b949e" text-anchor="middle">CI/CD</text>
    </g>

    <text x="20" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#8b949e">
      <tspan x="20" dy="0">High-performance test suite with</tspan>
      <tspan x="20" dy="16">sharded execution. Targets Chromium,</tspan>
      <tspan x="20" dy="16">WebKit &amp; Firefox engines with native</tspan>
      <tspan x="20" dy="16">GitHub Actions reporting workflow.</tspan>
    </text>

    <path d="M 2 238 L 2 195 Q 50 170 90 210 T 170 180 T 250 200 T 268 165 L 268 238 Z" fill="url(#chart_blue)"/>
    <path d="M 2 195 Q 50 170 90 210 T 170 180 T 250 200 T 268 165" fill="none" stroke="#0070f3" stroke-width="2"/>
    <circle cx="268" cy="165" r="3.5" fill="#0070f3"/>
  </g>

  <!-- ================= CARD 4: AI QA RESEARCH ================= -->
  <g transform="translate(895, 55)">
    <rect x="0" y="0" width="280" height="240" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff">AI-Powered QA Research</text>
    <text x="20" y="48" font-family="monospace" font-size="9" font-weight="bold" fill="#7928ca">LLM INTEGRATION // RAG</text>

    <line x1="20" y1="58" x2="260" y2="58" stroke="#30363d" stroke-width="0.8"/>

    <g transform="translate(20, 68)" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">
      <rect x="0" y="0" width="50" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="25" y="12" fill="#8b949e" text-anchor="middle">Python</text>
      
      <rect x="55" y="0" width="44" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="0.6"/>
      <text x="77" y="12" fill="#8b949e" text-anchor="middle">AI/ML</text>

      <rect x="104" y="0" width="80" height="18" rx="9" fill="#faf5ff" stroke="#e9d5ff" stroke-width="0.6"/>
      <text x="144" y="12" fill="#9d4edd" text-anchor="middle">Agentic QA</text>
    </g>

    <text x="20" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#8b949e">
      <tspan x="20" dy="0">Exploring AI-driven test script</tspan>
      <tspan x="20" dy="16">synthesis, Model Context Protocol</tspan>
      <tspan x="20" dy="16">(MCP) server layers, and RAG pipelines</tspan>
      <tspan x="20" dy="16">for advanced QA dynamic automation.</tspan>
    </text>

    <path d="M 2 238 L 2 220 Q 50 200 90 230 T 170 190 T 250 210 T 278 180 L 278 238 Z" fill="url(#chart_purple)"/>
    <path d="M 2 220 Q 50 200 90 230 T 170 190 T 250 210 T 278 180" fill="none" stroke="#7928ca" stroke-width="2"/>
    <circle cx="170" cy="190" r="3.5" fill="#7928ca"/>
  </g>
</svg>
