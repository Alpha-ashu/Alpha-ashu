<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#050d1a"/>
      <stop offset="50%"  stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f35"/>
    </linearGradient>

    <!-- Card gradients -->
    <linearGradient id="card1" x1="0" y1="0" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0A74DA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#43B02A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2EAD33" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3178C6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF6F00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10A37F" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Section header gradient -->
    <linearGradient id="hdrLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#8A2BE2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient orbs -->
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8A2BE2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <ellipse cx="200"  cy="210" rx="280" ry="200" fill="url(#orbA)" filter="url(#soft)" opacity="0.5">
    <animate attributeName="opacity" values="0.4;0.65;0.4" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1000" cy="210" rx="280" ry="200" fill="url(#orbB)" filter="url(#soft)" opacity="0.5">
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="10s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Section header -->
  <text x="600" y="52" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" filter="url(#glow)">&#x1F4CC; Open Source Projects</text>
  <line x1="60" y1="64" x2="1140" y2="64" stroke="url(#hdrLine)" stroke-width="1">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- ═══ CARD 1 — Karate API Framework ═══ -->
  <rect x="30"  y="84" width="265" height="300" rx="16" fill="url(#card1)"/>
  <rect x="30"  y="84" width="265" height="300" rx="16" fill="none" stroke="rgba(10,116,218,0.45)" stroke-width="1"/>
