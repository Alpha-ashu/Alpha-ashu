  <text x="447" y="120" text-anchor="middle" font-size="26" font-family="'Segoe UI Emoji',system-ui">&#x1F9EA;</text>
  <text x="447" y="148" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">Selenium Automation</text>
