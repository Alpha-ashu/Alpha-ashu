    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </line>
  <!-- TL corner -->
  <path d="M30 114 L30 100 Q30 84 46 84 L62 84" stroke="#0A74DA" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="30" cy="84" r="2.8" fill="#0A74DA" fill-opacity="0.9"/>
  <!-- Icon + Title -->
  <text x="162" y="120" text-anchor="middle" font-size="26" font-family="'Segoe UI Emoji',system-ui">&#x1F525;</text>
  <text x="162" y="148" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Karate API Framework</text>
