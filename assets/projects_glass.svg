    <path d="M 20 270 L 60 280 L 110 250 L 160 265 L 210 235 L 250 245" fill="none" stroke="#00f5a0" stroke-width="1.5"/>
    <rect x="207" y="232" width="6" height="6" fill="#00f5a0"/>

    <line x1="20" y1="305" x2="250" y2="305" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.3"/>
  </g>

