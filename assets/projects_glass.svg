  <rect x="616" y="168" width="78" height="20" rx="10" fill="rgba(49,120,198,0.25)" stroke="rgba(49,120,198,0.5)" stroke-width="0.8"/>
  <text x="655" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#6FC3FF">TypeScript</text>
  <rect x="700" y="168" width="72" height="20" rx="10" fill="rgba(46,173,51,0.25)" stroke="rgba(46,173,51,0.5)" stroke-width="0.8"/>
  <text x="736" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#4DD68C">Playwright</text>
  <rect x="778" y="168" width="50" height="20" rx="10" fill="rgba(32,136,255,0.25)" stroke="rgba(32,136,255,0.5)" stroke-width="0.8"/>
  <text x="803" y="182" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#58A6FF">CI/CD</text>
  <foreignObject x="614" y="196" width="237" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Segoe UI',sans-serif;font-size:11px;color:rgba(201,209,217,0.9);line-height:1.55;">
      Cross-browser testing, parallel execution, HTML reports &amp; CI/CD integration. Modern async-first architecture for reliable, fast runs across all browsers.
    </div>
  </foreignObject>
  <rect x="642" y="354" width="180" height="20" rx="10" fill="rgba(46,173,51,0.15)" stroke="rgba(46,173,51,0.3)" stroke-width="0.8"/>
  <text x="732" y="368" text-anchor="middle" font-family="system-ui" font-size="9.5" fill="#4DD68C">Cross-Browser · Async · BDD</text>

