      <tspan x="20" dy="18">parallel test runners. Cross-</tspan>
      <tspan x="20" dy="18">browser engine targeting Chromium,</tspan>
      <tspan x="20" dy="18">Firefox, &amp; WebKit. HTML reporting</tspan>
      <tspan x="20" dy="18">pipelines wired automatically</tspan>
      <tspan x="20" dy="18">to GitHub Actions workflow.</tspan>
    </text>

    <!-- Telemetry Graph Line -->
    <path d="M 20 250 L 80 260 L 130 235 L 180 255 L 210 230 L 250 220" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="247" y="217" width="6" height="6" fill="#58a6ff"/>

    <line x1="20" y1="305" x2="250" y2="305" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- ================= CARD 4: AI QA RESEARCH ================= -->
  <g transform="translate(895, 70)">
    <rect x="0" y="0" width="280" height="320" rx="6" fill="#0b1120" fill-opacity="0.8" stroke="#9d4edd" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="280" height="320" rx="6" fill="url(#glass_sheen)"/>
    
    <rect x="0" y="0" width="280" height="24" rx="6" fill="#030712" fill-opacity="0.9" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="15" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="25" cy="12" r="3.5" fill="#f59e0b"/>
    <circle cx="35" cy="12" r="3.5" fill="#10b981"/>
    <text x="265" y="15" font-family="monospace" font-size="8" font-weight="bold" fill="#9d4edd" text-anchor="end">[PORT: 5001]</text>
    
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">AI-Powered QA Research</text>
    <text x="20" y="71" font-family="monospace" font-size="9" fill="#9d4edd" letter-spacing="1">LLM INTEGRATION // AGENTIC</text>

    <line x1="20" y1="82" x2="260" y2="82" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.2"/>

    <g transform="translate(20, 91)">
      <rect x="0" y="0" width="52" height="18" rx="3" fill="#060a13" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="26" y="12" font-family="monospace" font-size="9" fill="#58a6ff" text-anchor="middle">Python</text>
      <rect x="58" y="0" width="46" height="18" rx="3" fill="#060a13" stroke="#ff6b35" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="81" y="12" font-family="monospace" font-size="9" fill="#ff6b35" text-anchor="middle">AI/ML</text>
      <rect x="110" y="0" width="38" height="18" rx="3" fill="#060a13" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="129" y="12" font-family="monospace" font-size="9" fill="#00f5a0" text-anchor="middle">LLM</text>
      <rect x="154" y="0" width="86" height="18" rx="3" fill="#060a13" stroke="#9d4edd" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="197" y="12" font-family="monospace" font-size="9" fill="#9d4edd" text-anchor="middle">Agentic QA</text>
    </g>

    <text x="20" y="136" font-family="system-ui, sans-serif" font-size="11.5" fill="#8f9cae">
      <tspan x="20" dy="0">Exploring AI-driven test script</tspan>
      <tspan x="20" dy="18">generation, MCP protocol support,</tspan>
      <tspan x="20" dy="18">and RAG pipelines. Prototyping</tspan>
      <tspan x="20" dy="18">intelligent agents to conduct</tspan>
      <tspan x="20" dy="18">dynamic test case synthesis</tspan>
      <tspan x="20" dy="18">within enterprise CI environments.</tspan>
    </text>

    <!-- Telemetry Graph Line -->
    <path d="M 20 280 L 60 250 L 110 270 L 160 240 L 210 260 L 260 230" fill="none" stroke="#9d4edd" stroke-width="1.5"/>
    <rect x="157" y="237" width="6" height="6" fill="#9d4edd"/>

    <line x1="20" y1="305" x2="260" y2="305" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.3"/>
