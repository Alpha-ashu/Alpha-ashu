      <rect x="52" y="0" width="65" height="18" rx="4" fill="#0e172a" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="84" y="12" font-family="monospace" font-size="9" fill="#00f5a0" text-anchor="middle">Selenium</text>
      <rect x="123" y="0" width="56" height="18" rx="4" fill="#0e172a" stroke="#ffbd2e" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="151" y="12" font-family="monospace" font-size="9" fill="#ffbd2e" text-anchor="middle">TestNG</text>
      <rect x="185" y="0" width="50" height="18" rx="4" fill="#0e172a" stroke="#9d4edd" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="210" y="12" font-family="monospace" font-size="9" fill="#9d4edd" text-anchor="middle">Maven</text>
    </g>

    <text x="20" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#8f9cae">
      <tspan x="20" dy="0">Enterprise Hybrid Automation</tspan>
      <tspan x="20" dy="18">Framework utilizing Page Object</tspan>
      <tspan x="20" dy="18">Model pattern. E-Commerce E2E</tspan>
      <tspan x="20" dy="18">flows: Login, search, checkout,</tspan>
      <tspan x="20" dy="18">and automated payments. Custom</tspan>
      <tspan x="20" dy="18">auto-screenshot on failure.</tspan>
    </text>

    <!-- Graph telemetry graphic -->
    <path d="M 20 270 L 60 280 L 110 250 L 160 265 L 210 235 L 250 245" fill="none" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M 20 270 L 60 280 L 110 250 L 160 265 L 210 235 L 250 245 L 250 295 L 20 295 Z" fill="url(#space_bg)" opacity="0.15"/>
    <circle cx="210" cy="235" r="3.5" fill="#00f5a0" filter="url(#neon_glow_cyan)"/>

    <line x1="20" y1="305" x2="250" y2="305" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- ================= CARD 3: PLAYWRIGHT FRAMEWORK ================= -->
  <g transform="translate(605, 70)">
    <rect x="0" y="0" width="270" height="320" rx="8" fill="#070c18" fill-opacity="0.6" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="270" height="24" rx="8" fill="#030712" fill-opacity="0.9" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="15" cy="12" r="3" fill="#ff5f56"/>
    <circle cx="25" cy="12" r="3" fill="#ffbd2e"/>
    <circle cx="35" cy="12" r="3" fill="#27c93f"/>
    <text x="255" y="15" font-family="monospace" font-size="8" fill="#58a6ff" text-anchor="end">[PORT: 9323]</text>
    
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">Playwright Framework</text>
    <text x="20" y="72" font-family="monospace" font-size="9" fill="#58a6ff">ASYNC RUNNER // SHARDED</text>

    <line x1="20" y1="82" x2="250" y2="82" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.2"/>

    <g transform="translate(20, 92)">
      <rect x="0" y="0" width="70" height="18" rx="4" fill="#0e172a" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="35" y="12" font-family="monospace" font-size="9" fill="#58a6ff" text-anchor="middle">TypeScript</text>
      <rect x="76" y="0" width="72" height="18" rx="4" fill="#0e172a" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="112" y="12" font-family="monospace" font-size="9" fill="#00f5a0" text-anchor="middle">Playwright</text>
      <rect x="154" y="0" width="50" height="18" rx="4" fill="#0e172a" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="179" y="12" font-family="monospace" font-size="9" fill="#00f2fe" text-anchor="middle">CI/CD</text>
    </g>

    <text x="20" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#8f9cae">
      <tspan x="20" dy="0">High-performance test suite with</tspan>
      <tspan x="20" dy="18">parallel test runners. Cross-</tspan>
      <tspan x="20" dy="18">browser engine targeting Chromium,</tspan>
      <tspan x="20" dy="18">Firefox, &amp; WebKit. HTML reporting</tspan>
      <tspan x="20" dy="18">pipelines wired automatically</tspan>
      <tspan x="20" dy="18">to GitHub Actions workflow.</tspan>
    </text>

    <!-- Graph telemetry graphic -->
    <path d="M 20 250 L 80 260 L 130 235 L 180 255 L 210 230 L 250 220" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M 20 250 L 80 260 L 130 235 L 180 255 L 210 230 L 250 220 L 250 295 L 20 295 Z" fill="url(#space_bg)" opacity="0.15"/>
    <circle cx="250" cy="220" r="3.5" fill="#58a6ff" filter="url(#neon_glow_cyan)"/>

    <line x1="20" y1="305" x2="250" y2="305" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.4"/>
  </g>

  <!-- ================= CARD 4: AI QA RESEARCH ================= -->
  <g transform="translate(895, 70)">
    <rect x="0" y="0" width="280" height="320" rx="8" fill="#070c18" fill-opacity="0.6" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="0" y="0" width="280" height="24" rx="8" fill="#030712" fill-opacity="0.9" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="15" cy="12" r="3" fill="#ff5f56"/>
    <circle cx="25" cy="12" r="3" fill="#ffbd2e"/>
    <circle cx="35" cy="12" r="3" fill="#27c93f"/>
    <text x="265" y="15" font-family="monospace" font-size="8" fill="#9d4edd" text-anchor="end">[PORT: 5001]</text>
    
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">AI-Powered QA Research</text>
    <text x="20" y="72" font-family="monospace" font-size="9" fill="#9d4edd">LLM INTEGRATION // AGENTIC</text>

    <line x1="20" y1="82" x2="260" y2="82" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.2"/>

    <g transform="translate(20, 92)">
      <rect x="0" y="0" width="52" height="18" rx="4" fill="#0e172a" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="26" y="12" font-family="monospace" font-size="9" fill="#58a6ff" text-anchor="middle">Python</text>
      <rect x="58" y="0" width="46" height="18" rx="4" fill="#0e172a" stroke="#ff6b35" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="81" y="12" font-family="monospace" font-size="9" fill="#ff6b35" text-anchor="middle">AI/ML</text>
      <rect x="110" y="0" width="38" height="18" rx="4" fill="#0e172a" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="129" y="12" font-family="monospace" font-size="9" fill="#00f5a0" text-anchor="middle">LLM</text>
      <rect x="154" y="0" width="86" height="18" rx="4" fill="#0e172a" stroke="#9d4edd" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="197" y="12" font-family="monospace" font-size="9" fill="#9d4edd" text-anchor="middle">Agentic QA</text>
    </g>

    <text x="20" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#8f9cae">
      <tspan x="20" dy="0">Exploring AI-driven test script</tspan>
      <tspan x="20" dy="18">generation, MCP protocol support,</tspan>
      <tspan x="20" dy="18">and RAG pipelines. Prototyping</tspan>
      <tspan x="20" dy="18">intelligent agents to conduct</tspan>
      <tspan x="20" dy="18">dynamic test case synthesis</tspan>
      <tspan x="20" dy="18">within enterprise CI environments.</tspan>
    </text>

    <!-- Graph telemetry graphic -->
    <path d="M 20 280 L 60 250 L 110 270 L 160 240 L 210 260 L 260 230" fill="none" stroke="#9d4edd" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M 20 280 L 60 250 L 110 270 L 160 240 L 210 260 L 260 230 L 260 295 L 20 295 Z" fill="url(#space_bg)" opacity="0.15"/>
    <circle cx="160" cy="240" r="3.5" fill="#9d4edd" filter="url(#neon_glow_cyan)"/>

    <line x1="20" y1="305" x2="260" y2="305" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.4"/>
  </g>
</svg>
