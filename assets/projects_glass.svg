    <text x="255" y="15" font-family="monospace" font-size="8" font-weight="bold" fill="#00f5a0" text-anchor="end">[PORT: 4444]</text>
    
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">Selenium Automation</text>
    <text x="20" y="71" font-family="monospace" font-size="9" fill="#00f5a0" letter-spacing="1">HYBRID // DATA DRIVEN</text>

