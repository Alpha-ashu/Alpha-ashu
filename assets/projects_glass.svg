  <text x="732" y="120" text-anchor="middle" font-size="26" font-family="'Segoe UI Emoji',system-ui">&#x26A1;</text>
  <text x="732" y="148" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Playwright Framework</text>
