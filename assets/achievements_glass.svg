<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="180" rx="8" fill="url(#bg_gradient)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1200" height="180" rx="8" fill="url(#console_grid)"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#1e293b" stroke-width="0.8"/>
  <text x="600" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_METRICS // CORE_MILESTONES_LOG ]
  </text>

  <!-- TABLE READOUT (Highly professional monospaced logger format) -->
  <g transform="translate(40, 55)" font-family="monospace" font-size="11.5" font-weight="bold">
    <!-- Headers -->
    <text x="10" y="15" fill="#38bdf8">LOG_ID</text>
    <text x="100" y="15" fill="#38bdf8">MILESTONE_DESC</text>
    <text x="500" y="15" fill="#38bdf8">SYSTEM_IMPACT</text>
    <text x="960" y="15" fill="#38bdf8">SYS_STATUS</text>

    <!-- Under Header line -->
    <line x1="0" y1="24" x2="1120" y2="24" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 1 -->
    <g transform="translate(0, 26)">
      <text x="10" y="18" fill="#64748b">LOG_001</text>
      <text x="100" y="18" fill="#ffffff">Enterprise API Test Suite (Karate + Java)</text>
      <text x="500" y="18" fill="#94a3b8">Eliminated major manual regression testing cycles</text>
      <text x="960" y="18" fill="#10b981">VERIFIED_100%</text>
      <line x1="0" y1="26" x2="1120" y2="26" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2,3"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 54)">
      <text x="10" y="18" fill="#64748b">LOG_002</text>
      <text x="100" y="18" fill="#ffffff">JSON Comparison Engine (Field Normaliser)</text>
      <text x="500" y="18" fill="#94a3b8">Validates 1000s of dynamic API records daily</text>
      <text x="960" y="18" fill="#10b981">STABLE_99.8%</text>
      <line x1="0" y1="26" x2="1120" y2="26" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2,3"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 82)">
      <text x="10" y="18" fill="#64748b">LOG_003</text>
      <text x="100" y="18" fill="#ffffff">Employee of the Quarter Award (AI QA Domain)</text>
      <text x="500" y="18" fill="#94a3b8">Awarded for measurable QA process improvements</text>
      <text x="960" y="18" fill="#38bdf8">HONORED</text>
      <line x1="0" y1="26" x2="1120" y2="26" stroke="#1e293b" stroke-width="0.6" stroke-dasharray="2,3"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 110)">
      <text x="10" y="18" fill="#64748b">LOG_004</text>
      <text x="100" y="18" fill="#ffffff">End-to-End Enterprise Module Ownership</text>
      <text x="500" y="18" fill="#94a3b8">Independently led test suite architecture &amp; triage</text>
      <text x="960" y="18" fill="#38bdf8">ACTIVE_RUN</text>
    </g>
  </g>
</svg>
