    <text x="15" y="125" font-family="monospace" font-size="8.5" fill="#64748b">COMPILER_OPTS: TARGET_17</text>
    <text x="15" y="138" font-family="monospace" font-size="8.5" fill="#64748b">RUNTIME_ENV: NODE_v20 // PY_3.11</text>
  </g>

