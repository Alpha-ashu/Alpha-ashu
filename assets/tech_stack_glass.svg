    <g transform="translate(15, 42)" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">
      <!-- Item 1 -->
      <rect x="0" y="0" width="115" height="24" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="15">JAVA [17/21]</text>
      <!-- Item 2 -->
      <rect x="125" y="0" width="115" height="24" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="137" y="15">PYTHON [3.x]</text>
      <!-- Item 3 -->
      <rect x="0" y="32" width="115" height="24" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
      <text x="12" y="47">JAVASCRIPT</text>
