  <g transform="translate(25, 250)">
    <rect x="0" y="0" width="1150" height="100" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    
    <text x="20" y="22" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">[ TEST_COVERAGE_PROTOCOLS ]</text>
    <line x1="20" y1="28" x2="1130" y2="28" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Grid labels -->
    <g transform="translate(20, 42)" font-family="monospace" font-size="10.5" font-weight="bold" fill="#94a3b8">
      <!-- Col 1 -->
      <text x="0" y="12">&gt; Functional Testing</text>
      <text x="0" y="32">&gt; Regression Testing</text>
      <text x="0" y="52">&gt; Smoke &amp; Sanity Checks</text>

      <!-- Col 2 -->
      <text x="280" y="12">&gt; API &amp; Backend Verification</text>
      <text x="280" y="32">&gt; Integration Workflows</text>
      <text x="280" y="52">&gt; System Verification</text>

      <!-- Col 3 -->
      <text x="580" y="12">&gt; End-to-End Automation</text>
      <text x="580" y="32">&gt; Mobile Testing (Appium)</text>
      <text x="580" y="52">&gt; Data-Driven Execution</text>

      <!-- Col 4 -->
