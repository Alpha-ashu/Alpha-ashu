      <rect x="0" y="64" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="15" y="80">🔌 JSON Schema</text>
      <rect x="120" y="64" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="135" y="80">🚀 Insomnia</text>
    </g>

