    [ SYSTEM_CAPABILITIES // TECH_STACK_MATRIX ]
  </text>

  <!-- ================= MODULE 1: LANGUAGES ================= -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="270" height="180" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
