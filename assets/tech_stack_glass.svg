      <rect x="125" y="0" width="115" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="140" y="16">🐙 Git / GitHub</text>
      
      <rect x="0" y="32" width="115" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="15" y="48">📦 Docker</text>
      <rect x="125" y="32" width="115" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="140" y="48">🛠️ Maven Build</text>

      <rect x="0" y="64" width="115" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="15" y="80">🗄️ SQL / MySQL</text>
      <rect x="125" y="64" width="115" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="140" y="80">📋 Jira / Agile</text>
    </g>

    <line x1="0" y1="180" x2="50" y2="180" stroke="#9d4edd" stroke-width="2"/>
  </g>

  <!-- ================= BOTTOM PANEL: TEST COVERAGE ================= -->
  <g transform="translate(25, 250)">
    <rect x="0" y="0" width="1150" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
