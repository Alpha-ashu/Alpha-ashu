<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="340" rx="16" fill="url(#bg_gradient)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="1200" height="340" rx="16" fill="url(#console_grid)"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_CAPABILITIES // TECH_STACK_MATRIX ]
  </text>

  <!-- ================= MODULE 1: LANGUAGES ================= -->
  <g transform="translate(25, 48)">
    <rect x="0" y="0" width="270" height="155" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">&gt; LANGUAGES</text>
    <line x1="20" y1="28" x2="250" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <!-- Tech items -->
    <g transform="translate(20, 38)" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="16" fill="#8b949e">☕ Java</text>
      
      <rect x="120" y="0" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="135" y="16" fill="#8b949e">🐍 Python</text>
      
      <rect x="0" y="32" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="48" fill="#8b949e">🟨 JavaScript</text>
      
      <rect x="120" y="32" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="135" y="48" fill="#8b949e">🟦 TypeScript</text>
    </g>

    <text x="20" y="116" font-family="monospace" font-size="8.5" fill="#8b949e">COMPILER: TARGET_17</text>
    <text x="20" y="128" font-family="monospace" font-size="8.5" fill="#8b949e">ENV: NODE_v20 // PY_3.11</text>
  </g>

  <!-- ================= MODULE 2: UI AUTOMATION ================= -->
  <g transform="translate(315, 48)">
    <rect x="0" y="0" width="270" height="155" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">&gt; UI_AUTOMATION</text>
    <line x1="20" y1="28" x2="250" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <g transform="translate(20, 38)" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="16" fill="#8b949e">🌐 Selenium</text>
      <rect x="120" y="0" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="135" y="16" fill="#8b949e">🎭 Playwright</text>
      
      <rect x="0" y="32" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="48" fill="#8b949e">🧪 TestNG</text>
      <rect x="120" y="32" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="135" y="48" fill="#8b949e">🥒 Cucumber</text>
    </g>
  </g>

  <!-- ================= MODULE 3: API & BACKEND ================= -->
  <g transform="translate(605, 48)">
    <rect x="0" y="0" width="270" height="155" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">&gt; API_BACKEND</text>
    <line x1="20" y1="28" x2="250" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <g transform="translate(20, 38)" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="16" fill="#8b949e">⚡ Karate DSL</text>
      <rect x="120" y="0" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="135" y="16" fill="#8b949e">📬 Postman</text>
      
      <rect x="0" y="32" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="48" fill="#8b949e">🔗 REST Assured</text>
      <rect x="120" y="32" width="110" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="135" y="48" fill="#8b949e">📖 Swagger</text>
    </g>
  </g>

  <!-- ================= MODULE 4: DEVOPS & TOOLS ================= -->
  <g transform="translate(895, 48)">
    <rect x="0" y="0" width="280" height="155" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">&gt; DEVOPS_TOOLS</text>
    <line x1="20" y1="28" x2="260" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <g transform="translate(20, 38)" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">
      <rect x="0" y="0" width="115" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="16" fill="#8b949e">🔧 Jenkins CI</text>
      <rect x="125" y="0" width="115" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="140" y="16" fill="#8b949e">🐙 Git / GitHub</text>
      
      <rect x="0" y="32" width="115" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="15" y="48" fill="#8b949e">📦 Docker</text>
      <rect x="125" y="32" width="115" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="140" y="48" fill="#8b949e">🛠️ Maven Build</text>
    </g>
  </g>

  <!-- ================= BOTTOM PANEL: TEST COVERAGE ================= -->
  <g transform="translate(25, 218)">
    <rect x="0" y="0" width="1150" height="98" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="10.5" fill="#58a6ff">[ TEST_COVERAGE_PROTOCOLS ]</text>
    <line x1="20" y1="28" x2="1130" y2="28" stroke="#30363d" stroke-width="0.8"/>

    <!-- Grid labels -->
    <g transform="translate(20, 42)" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#8b949e">
      <!-- Col 1 -->
      <text x="0" y="12">✓ Functional Testing</text>
      <text x="0" y="32">✓ Regression Testing</text>
      <text x="0" y="52">✓ Smoke &amp; Sanity Checks</text>

      <!-- Col 2 -->
      <text x="280" y="12">✓ API &amp; Backend Verification</text>
      <text x="280" y="32">✓ Integration Workflows</text>
      <text x="280" y="52">✓ System Verification</text>

      <!-- Col 3 -->
      <text x="580" y="12">✓ End-to-End Automation</text>
      <text x="580" y="32">✓ Mobile Testing (Appium)</text>
      <text x="580" y="52">✓ Data-Driven Execution</text>

      <!-- Col 4 -->
      <text x="880" y="12">✓ BDD Cucumber Frameworks</text>
      <text x="880" y="32">✓ Hybrid / POM Architectures</text>
      <text x="880" y="52">✓ Healthcare &amp; FinTech Focus</text>
    </g>
  </g>
</svg>
