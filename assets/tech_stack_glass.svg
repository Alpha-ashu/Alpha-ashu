<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="380" rx="8" fill="url(#bg_gradient)" stroke="#1e293b" stroke-width="1.2"/>
