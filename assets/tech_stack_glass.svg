<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="widget_sheen" x1="0" y1="0" x2="270" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND CONTAINER -->
  <rect width="1200" height="380" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- SECTION HEADER -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="600" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle" letter-spacing="4">
    [ SYSTEM_CAPABILITIES // TECH_STACK_MATRIX ]
  </text>

  <!-- ================= MODULE 1: LANGUAGES ================= -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="270" height="180" rx="12" fill="url(#widget_sheen)" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">&gt; LANGUAGES</text>
    <line x1="20" y1="32" x2="250" y2="32" stroke="#e2e8f0" stroke-width="0.8"/>

    <!-- Tech items -->
    <g transform="translate(20, 45)" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="15" y="16">☕ Java</text>
      
      <rect x="120" y="0" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="135" y="16">🐍 Python</text>
      
      <rect x="0" y="32" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="15" y="48">🟨 JavaScript</text>
      
      <rect x="120" y="32" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="135" y="48">🟦 TypeScript</text>
    </g>

    <text x="20" y="128" font-family="monospace" font-size="9" fill="#64748b">COMPILER_OPTS: TARGET_17</text>
    <text x="20" y="142" font-family="monospace" font-size="9" fill="#64748b">RUNTIME_ENV: NODE_v20 // PY_3.11</text>
    <line x1="0" y1="180" x2="50" y2="180" stroke="#00d2ff" stroke-width="2"/>
  </g>

  <!-- ================= MODULE 2: UI AUTOMATION ================= -->
  <g transform="translate(315, 55)">
    <rect x="0" y="0" width="270" height="180" rx="12" fill="url(#widget_sheen)" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">&gt; UI_AUTOMATION</text>
    <line x1="20" y1="32" x2="250" y2="32" stroke="#e2e8f0" stroke-width="0.8"/>

    <g transform="translate(20, 45)" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#0f172a">
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="15" y="16">🌐 Selenium</text>
      <rect x="120" y="0" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="135" y="16">🎭 Playwright</text>
      
      <rect x="0" y="32" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="15" y="48">🧪 TestNG</text>
      <rect x="120" y="32" width="110" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="135" y="48">🥒 Cucumber</text>

