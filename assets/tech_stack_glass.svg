    <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="10.5" fill="#475569">[ TEST_COVERAGE_PROTOCOLS ]</text>
    <line x1="20" y1="28" x2="1130" y2="28" stroke="#cbd5e1" stroke-width="0.8"/>

