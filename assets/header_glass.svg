<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>

    <!-- Gradient for flowchart arrows -->
    <linearGradient id="arrow_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect width="1200" height="240" rx="8" fill="url(#bg_gradient)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="1200" height="240" rx="8" fill="url(#console_grid)"/>

  <!-- Top Console Header Bar -->
  <rect x="0" y="0" width="1200" height="28" rx="8" fill="#020408" stroke="#1e293b" stroke-width="1"/>
  <!-- Console window buttons -->
  <circle cx="20" cy="14" r="3.5" fill="#ef4444"/>
  <circle cx="32" cy="14" r="3.5" fill="#f59e0b"/>
  <circle cx="44" cy="14" r="3.5" fill="#10b981"/>
  <text x="65" y="18" font-family="monospace" font-size="9.5" font-weight="bold" fill="#64748b" letter-spacing="1">QA_AUTOMATION_CONSOLE_v3.2 // LIVE</text>
  <text x="1180" y="18" font-family="monospace" font-size="9.5" font-weight="bold" fill="#38bdf8" text-anchor="end" letter-spacing="1">SYSTEM_SECURE</text>

  <!-- 2. OPERATOR IDENTITY (Left) -->
  <g transform="translate(30, 50)">
    <!-- Subtitle indicator -->
    <text x="0" y="15" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8" letter-spacing="2">SYSTEM_OPERATOR // IN_DL</text>
    
    <!-- Operator Name -->
    <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">K. Shaik Ashraf</text>
    
    <!-- Professional Roles -->
    <text x="0" y="78" font-family="monospace" font-size="11.5" font-weight="bold" fill="#94a3b8" letter-spacing="1">ROLE: SENIOR QA AUTOMATION ENGINEER</text>
    <text x="0" y="96" font-family="monospace" font-size="11.5" font-weight="bold" fill="#94a3b8" letter-spacing="1">DEPT: ENTERPRISE TEST ARCHITECTURE</text>
    <text x="0" y="114" font-family="monospace" font-size="11.5" font-weight="bold" fill="#94a3b8" letter-spacing="1">CERT: ISTQB® CTFL [ID: CERT_992837]</text>
  </g>

  <!-- 3. CI/CD FLOWCHART BOARD (Center) -->
  <g transform="translate(480, 58)">
    <rect x="0" y="0" width="410" height="150" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="20" font-family="monospace" font-size="9.5" font-weight="bold" fill="#64748b">[ AUTOMATION_PIPELINE_FLOW ]</text>
    <line x1="15" y1="28" x2="395" y2="28" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Flowchart Nodes -->
    <!-- Node 1: COMMIT -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#090d16" stroke="#38bdf8" stroke-width="1"/>
      <text x="35" y="15" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">COMMIT</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 85 57 L 110 57" stroke="url(#arrow_grad)" stroke-width="2"/>
    <path d="M 110 57 L 105 53 M 110 57 L 105 61" stroke="#10b981" stroke-width="1.5"/>

    <!-- Node 2: JENKINS -->
    <g transform="translate(115, 45)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#090d16" stroke="#10b981" stroke-width="1"/>
      <text x="42.5" y="15" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">JENKINS_CI</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 200 57 L 225 57" stroke="url(#arrow_grad)" stroke-width="2"/>
    <path d="M 225 57 L 220 53 M 225 57 L 220 61" stroke="#10b981" stroke-width="1.5"/>

    <!-- Node 3: SUITE -->
    <g transform="translate(230, 45)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#090d16" stroke="#10b981" stroke-width="1"/>
      <text x="42.5" y="15" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">KARATE_API</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 315 57 L 330 57 L 330 95 L 15 95 L 15 120 L 30 120" stroke="url(#arrow_grad)" stroke-width="1.5" fill="none"/>
    <path d="M 30 120 L 25 116 M 30 120 L 25 124" stroke="#10b981" stroke-width="1.5"/>

    <!-- Node 4: COMPARE -->
    <g transform="translate(35, 108)">
      <rect x="0" y="0" width="105" height="24" rx="4" fill="#090d16" stroke="#10b981" stroke-width="1"/>
      <text x="52.5" y="15" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">JSON_COMPARE</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 140 120 L 165 120" stroke="url(#arrow_grad)" stroke-width="2"/>
    <path d="M 165 120 L 160 116 M 165 120 L 160 124" stroke="#10b981" stroke-width="1.5"/>

    <!-- Node 5: VERIFIED -->
    <g transform="translate(170, 108)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#090d16" stroke="#10b981" stroke-width="1"/>
      <text x="42.5" y="15" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Flow indicator status -->
    <text x="395" y="140" font-family="monospace" font-size="9" fill="#10b981" text-anchor="end">STATUS: ACTIVE</text>
  </g>

  <!-- 4. SYSTEM TELEMETRY (Right) -->
  <g transform="translate(910, 58)">
    <rect x="0" y="0" width="260" height="150" rx="6" fill="#020408" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="20" font-family="monospace" font-size="9.5" font-weight="bold" fill="#64748b">[ ENGINE_TELEMETRY ]</text>
    <line x1="15" y1="28" x2="245" y2="28" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Metrics rows -->
    <g transform="translate(15, 42)" font-family="monospace" font-size="10.5" font-weight="bold">
      <!-- Row 1 -->
      <rect x="0" y="2" width="6" height="6" fill="#10b981"/>
      <text x="18" y="9" fill="#8f9cae">BUILD: <tspan fill="#ffffff">SUCCESS</tspan></text>

      <!-- Row 2 -->
      <rect x="0" y="22" width="6" height="6" fill="#38bdf8"/>
      <text x="18" y="29" fill="#8f9cae">PIPELINE: <tspan fill="#ffffff">ACTIVE</tspan></text>

      <!-- Row 3 -->
      <rect x="0" y="42" width="6" height="6" fill="#38bdf8"/>
      <text x="18" y="49" fill="#8f9cae">REGRESSION: <tspan fill="#ffffff">DAILY</tspan></text>

      <!-- Row 4 -->
      <rect x="0" y="62" width="6" height="6" fill="#10b981"/>
      <text x="18" y="69" fill="#8f9cae">COVERAGE: <tspan fill="#ffffff">92.4%</tspan></text>

      <!-- Row 5 -->
      <rect x="0" y="82" width="6" height="6" fill="#38bdf8"/>
      <text x="18" y="89" fill="#8f9cae">LATENCY: <tspan fill="#ffffff">1.2ms_AVG</tspan></text>
    </g>
  </g>
</svg>
