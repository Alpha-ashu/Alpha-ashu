<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glow_grad_orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5e62" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff5e62" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow_grad_blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0070f3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="260" rx="16" fill="url(#bg_gradient)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="1200" height="260" rx="16" fill="url(#console_grid)"/>

  <!-- ================= LEFT FLOATING WIDGET (Experience) ================= -->
  <g transform="translate(45, 55)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#8b949e" letter-spacing="1.5">ACTIVE_EXPERIENCE</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">5+ Years</text>
    <text x="20" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">Senior QA Engineer</text>

    <!-- Mini chart -->
    <path d="M 120 135 L 140 105 L 160 115 L 180 90 L 200 100 L 218 80 L 218 148 L 120 148 Z" fill="url(#glow_grad_orange)" opacity="0.4"/>
    <path d="M 120 135 L 140 105 L 160 115 L 180 90 L 200 100 L 218 80" fill="none" stroke="#ff5e62" stroke-width="2"/>
    <circle cx="218" cy="80" r="3.5" fill="#ff5e62"/>
  </g>

  <!-- ================= CENTER NAME & ROLE ================= -->
  <g transform="translate(300, 55)">
    <!-- Header decoration -->
    <rect x="235" y="10" width="130" height="20" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="300" y="23" font-family="monospace" font-size="9" font-weight="bold" fill="#58a6ff" text-anchor="middle">PLATFORM: DEPLOYED</text>
    
    <!-- Title -->
    <text x="300" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">K. Shaik Ashraf</text>
    
    <!-- Subtitle -->
    <text x="300" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">
      Senior QA Automation Engineer &amp; Framework Architect
    </text>

    <!-- Flow line divider -->
    <line x1="100" y1="125" x2="500" y2="125" stroke="#30363d" stroke-width="1" stroke-dasharray="3,4"/>
    <circle cx="300" cy="125" r="4.5" fill="#0070f3"/>
    <circle cx="200" cy="125" r="3.5" fill="#10b981"/>
    <circle cx="400" cy="125" r="3.5" fill="#ff5e62"/>
  </g>

  <!-- ================= RIGHT FLOATING WIDGET (Reliability) ================= -->
  <g transform="translate(935, 55)">
    <rect x="0" y="0" width="220" height="150" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#8b949e" letter-spacing="1.5">TEST_RELIABILITY</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">99.8%</text>
    <text x="20" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff">1000s of API Records</text>

    <!-- Mini chart -->
    <path d="M 120 135 L 140 120 L 160 125 L 180 95 L 200 110 L 218 85 L 218 148 L 120 148 Z" fill="url(#glow_grad_blue)" opacity="0.4"/>
    <path d="M 120 135 L 140 120 L 160 125 L 180 95 L 200 110 L 218 85" fill="none" stroke="#0070f3" stroke-width="2"/>
    <circle cx="218" cy="85" r="3.5" fill="#0070f3"/>
  </g>

  <!-- ================= BOTTOM CONSOLE BADGES ================= -->
  <g transform="translate(300, 215)" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="15" cy="13" r="4.5" fill="#0070f3"/>
    <text x="28" y="17" fill="#8b949e">ISTQB® CTFL</text>

    <!-- Badge 2 -->
    <rect x="145" y="0" width="140" height="26" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="15" cy="13" r="4.5" fill="#10b981"/>
    <text x="28" y="17" fill="#8b949e">Healthcare Domain</text>

    <!-- Badge 3 -->
    <rect x="300" y="0" width="140" height="26" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="15" cy="13" r="4.5" fill="#ff5e62"/>
    <text x="28" y="17" fill="#8b949e">Framework Architect</text>

    <!-- Badge 4 -->
    <rect x="455" y="0" width="145" height="26" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="15" cy="13" r="4.5" fill="#7928ca"/>
    <text x="28" y="17" fill="#8b949e">Continuous Pipelines</text>
  </g>
</svg>
