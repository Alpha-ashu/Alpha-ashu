  <path d="M90 256 Q90 276 112 276"       fill="none" stroke="rgba(255,107,53,0.40)" stroke-width="1"/>
  <path d="M1110 256 Q1110 276 1088 276" fill="none" stroke="rgba(88,166,255,0.40)"  stroke-width="1"/>

  <path d="M90 76 L90 44 Q90 24 112 24 L144 24" stroke="#58A6FF" stroke-width="2.2" fill="none" stroke-linecap="round">
