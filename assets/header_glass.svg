<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg_gradient" x1="600" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Mesh Grid Pattern (Clean and sharp) -->
    <pattern id="console_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#58a6ff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <!-- Crisp Glass Specular Gradient (Simulating glass sheen/reflection) -->
    <linearGradient id="glass_sheen" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.01"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Sharp Border Gradient -->
    <linearGradient id="glass_border" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Color Accent Gradients -->
    <linearGradient id="cyan_accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
  </defs>

  <!-- 1. BASE BACKGROUND -->
  <rect width="1200" height="320" fill="url(#bg_gradient)"/>
  <rect width="1200" height="320" fill="url(#console_grid)"/>

  <!-- 2. CYBER CONSOLE CONTAINER (Glassmorphic Outer Frame) -->
  <!-- Glass fill -->
  <rect x="25" y="25" width="1150" height="270" rx="6" fill="#0b1120" fill-opacity="0.75"/>
  <!-- Glass sheen overlay -->
  <rect x="25" y="25" width="1150" height="270" rx="6" fill="url(#glass_sheen)"/>
  <!-- Sharp glass border -->
  <rect x="25" y="25" width="1150" height="270" rx="6" fill="none" stroke="url(#glass_border)" stroke-width="1.2"/>

  <!-- Precise Corner Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <path d="M 1180 40 L 1180 20 L 1160 20" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <path d="M 20 280 L 20 300 L 40 300" stroke="#58a6ff" stroke-width="2" fill="none"/>
  <path d="M 1180 280 L 1180 300 L 1160 300" stroke="#58a6ff" stroke-width="2" fill="none"/>

  <!-- Telemetry Alignment Marks (+) -->
  <path d="M 90 50 M 85 50 L 95 50 M 90 45 L 90 55" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.3"/>
  <path d="M 1110 50 M 1105 50 L 1115 50 M 1110 45 L 1110 55" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.3"/>
  <path d="M 90 270 M 85 270 L 95 270 M 90 265 L 90 275" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.3"/>
  <path d="M 1110 270 M 1105 270 L 1115 270 M 1110 265 L 1110 275" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- 3. TOP TELEMETRY READOUT BAR -->
  <rect x="25" y="25" width="1150" height="28" fill="#030712" fill-opacity="0.9" stroke="url(#glass_border)" stroke-width="1"/>
  <!-- Console window buttons -->
  <circle cx="45" cy="39" r="3.5" fill="#ef4444"/>
  <circle cx="57" cy="39" r="3.5" fill="#f59e0b"/>
  <circle cx="69" cy="39" r="3.5" fill="#10b981"/>

  <!-- Telemetry text segments -->
  <text x="95" y="43" font-family="monospace" font-size="9.5" font-weight="bold" fill="#8f9cae" letter-spacing="1">SYS_ST: <tspan fill="#10b981">ONLINE</tspan></text>
  <circle cx="190" cy="39" r="3" fill="#10b981"/>

  <text x="215" y="43" font-family="monospace" font-size="9.5" font-weight="bold" fill="#8f9cae" letter-spacing="1">LOC: <tspan fill="#58a6ff">IN_DL</tspan></text>
  <text x="315" y="43" font-family="monospace" font-size="9.5" font-weight="bold" fill="#8f9cae" letter-spacing="1">FPS: <tspan fill="#00f2fe">60_FIXED</tspan></text>

  <text x="1145" y="43" font-family="monospace" font-size="9.5" font-weight="bold" fill="#00f2fe" text-anchor="end" letter-spacing="1">SH_SYS_v3.0.0</text>

  <!-- 4. CORE HERO CONTENT (Sharp typography) -->
  <!-- Name -->
  <text x="600" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    K. SHAIK ASHRAF
  </text>

  <!-- Subtitle -->
  <text x="600" y="176" font-family="monospace" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="middle" letter-spacing="4">
    SENIOR QA AUTOMATION ENGINEER // FRAMEWORK ARCHITECT
  </text>

  <!-- Clean, sharp geometry line divider -->
  <line x1="420" y1="198" x2="780" y2="198" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="3,4" stroke-opacity="0.4"/>
  <rect x="596" y="194" width="8" height="8" fill="#9d4edd"/>
  <rect x="497" y="195" width="6" height="6" fill="#00f2fe"/>
  <rect x="697" y="195" width="6" height="6" fill="#00f5a0"/>

  <!-- 5. CRISP STATS PILLS (Glass panels without blur) -->
  <!-- Pill 1: Experience -->
  <g transform="translate(230, 228)">
    <rect x="0" y="0" width="160" height="34" rx="6" fill="#060a13" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5"/>
    <rect x="2" y="2" width="156" height="30" rx="4" fill="url(#glass_sheen)"/>
    <text x="15" y="21" font-family="monospace" font-size="10" font-weight="bold" fill="#00f2fe">&gt;</text>
    <text x="30" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">5+ YRS EXP</text>
    <text x="145" y="21" font-family="monospace" font-size="9" fill="#8f9cae" text-anchor="end">[ACT]</text>
  </g>

  <!-- Pill 2: ISTQB -->
  <g transform="translate(410, 228)">
    <rect x="0" y="0" width="160" height="34" rx="6" fill="#060a13" stroke="#9d4edd" stroke-width="0.8" stroke-opacity="0.5"/>
    <rect x="2" y="2" width="156" height="30" rx="4" fill="url(#glass_sheen)"/>
    <text x="15" y="21" font-family="monospace" font-size="10" font-weight="bold" fill="#9d4edd">&gt;</text>
    <text x="30" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">ISTQB® CTFL</text>
    <text x="145" y="21" font-family="monospace" font-size="9" fill="#8f9cae" text-anchor="end">[CRT]</text>
  </g>

  <!-- Pill 3: Healthcare -->
  <g transform="translate(590, 228)">
    <rect x="0" y="0" width="175" height="34" rx="6" fill="#060a13" stroke="#00f5a0" stroke-width="0.8" stroke-opacity="0.5"/>
    <rect x="2" y="2" width="171" height="30" rx="4" fill="url(#glass_sheen)"/>
    <text x="15" y="21" font-family="monospace" font-size="10" font-weight="bold" fill="#00f5a0">&gt;</text>
    <text x="30" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">HEALTHCARE QA</text>
    <text x="160" y="21" font-family="monospace" font-size="9" fill="#8f9cae" text-anchor="end">[DOM]</text>
  </g>

  <!-- Pill 4: Automation -->
  <g transform="translate(785, 228)">
    <rect x="0" y="0" width="180" height="34" rx="6" fill="#060a13" stroke="#58a6ff" stroke-width="0.8" stroke-opacity="0.5"/>
    <rect x="2" y="2" width="176" height="30" rx="4" fill="url(#glass_sheen)"/>
    <text x="15" y="21" font-family="monospace" font-size="10" font-weight="bold" fill="#58a6ff">&gt;</text>
    <text x="30" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">AUTO ARCHITECT</text>
    <text x="165" y="21" font-family="monospace" font-size="9" fill="#8f9cae" text-anchor="end">[ROL]</text>
  </g>
</svg>
