  </path>
  <circle cx="90" cy="24" r="3.8" fill="#58A6FF" fill-opacity="0.75">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <path d="M1110 76 L1110 44 Q1110 24 1088 24 L1056 24" stroke="#8A2BE2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="1110" cy="24" r="3.8" fill="#8A2BE2" fill-opacity="0.75">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <path d="M90 224 L90 256 Q90 276 112 276 L144 276"         stroke="#FF6B35" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M1110 224 L1110 256 Q1110 276 1088 276 L1056 276" stroke="#58A6FF"  stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55"/>

  <line x1="380" y1="56" x2="820" y2="56" stroke="rgba(88,166,255,0.14)" stroke-width="0.6"/>

  <text x="600" y="86" text-anchor="middle" font-size="22" font-family="'Segoe UI Emoji',system-ui">🚀</text>

  <text x="600" y="142" text-anchor="middle" font-family="'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF" filter="url(#titleGlow)">
    K. Shaik Ashraf
    <animate attributeName="opacity" values="0.90;1;0.90" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12.5" letter-spacing="2.5" font-weight="400" fill="#58A6FF" opacity="0.88">
    SENIOR QA AUTOMATION ENGINEER  &#xB7;  FRAMEWORK ARCHITECT  &#xB7;  FOUNDER
  </text>

