<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#050d1a"/>
      <stop offset="38%"  stop-color="#0a1628"/>
      <stop offset="68%"  stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#13082a"/>
    </linearGradient>
    <linearGradient id="glass" x1="90" y1="24" x2="1110" y2="276" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.13"/>
      <stop offset="48%"  stop-color="#ffffff"  stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#8A2BE2"  stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="topBorder" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#58A6FF" stop-opacity="0.85"/>
      <stop offset="72%"  stop-color="#8A2BE2"  stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8A2BE2"  stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botBorder" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FF6B35" stop-opacity="0.45"/>
      <stop offset="70%"  stop-color="#58A6FF"  stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#58A6FF"  stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#58A6FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0078D4"  stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbP" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8A2BE2" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6C3483"  stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbO" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF6B35"  stop-opacity="0"/>
    </radialGradient>
    <filter id="orbBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="titleGlow" x="-15%" y="-80%" width="130%" height="260%">
      <feGaussianBlur stdDeviation="6" result="gb"/>
      <feMerge>
        <feMergeNode in="gb"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <ellipse cx="155" cy="148" rx="230" ry="165" fill="url(#orbB)" filter="url(#orbBlur)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0; 22 -16; -8 12; 0 0" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.65;0.9;0.65" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1045" cy="152" rx="240" ry="170" fill="url(#orbP)" filter="url(#orbBlur)" opacity="0.75">
    <animateTransform attributeName="transform" type="translate" values="0 0; -18 14; 12 -10; 0 0" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.55;0.80;0.55" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="600" cy="255" rx="290" ry="95" fill="url(#orbO)" filter="url(#orbBlur)" opacity="0.6">
