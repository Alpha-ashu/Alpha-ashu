  <circle cx="600" cy="190" r="2.8" fill="#58A6FF" opacity="0.75">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <line x1="606" y1="190" x2="778" y2="190" stroke="rgba(88,166,255,0.28)" stroke-width="0.8"/>

