  <text x="714" y="223" text-anchor="middle" font-family="'Segoe UI Emoji','Segoe UI',system-ui" font-size="11.5" fill="#FF8C5A">&#x1F50D; Open To Work</text>

  <rect x="796" y="204" width="118" height="28" rx="14" fill="rgba(138,43,226,0.12)" stroke="rgba(138,43,226,0.38)" stroke-width="1"/>
  <text x="855" y="223" text-anchor="middle" font-family="'Segoe UI Emoji','Segoe UI',system-ui" font-size="11.5" fill="#B87BFF">&#x1F4A1; Founder x3</text>

  <line x1="380" y1="249" x2="820" y2="249" stroke="rgba(88,166,255,0.09)" stroke-width="0.6"/>

  <circle cx="158" cy="58" r="1.3" fill="#58A6FF" fill-opacity="0.42"/>
  <circle cx="176" cy="47" r="1.0" fill="#58A6FF" fill-opacity="0.26"/>
  <circle cx="170" cy="70" r="1.0" fill="#8A2BE2" fill-opacity="0.32"/>
  <circle cx="1042" cy="58" r="1.3" fill="#8A2BE2" fill-opacity="0.42"/>
  <circle cx="1024" cy="47" r="1.0" fill="#8A2BE2" fill-opacity="0.26"/>
  <circle cx="1030" cy="70" r="1.0" fill="#58A6FF" fill-opacity="0.32"/>
  <circle cx="600" cy="38" r="1.0" fill="#58A6FF" fill-opacity="0.45">
