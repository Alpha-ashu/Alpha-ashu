<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="space_bg" x1="600" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="console_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.07"/>
      <circle cx="30" cy="0" r="1" fill="#58a6ff" fill-opacity="0.15"/>
    </pattern>

    <!-- Glass Gradients -->
    <linearGradient id="panel_glass" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="panel_border" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#9d4edd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.4"/>
    </linearGradient>

    <!-- LED & Glow Filters -->
    <filter id="neon_glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Back Orbs -->
    <radialGradient id="orb_cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb_purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. BASE BACKGROUND -->
  <rect width="1200" height="320" fill="url(#space_bg)"/>

  <!-- 2. AMBIENT GLOWS -->
  <circle cx="150" cy="160" r="220" fill="url(#orb_cyan)">
    <animate attributeName="cx" values="150;220;150" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="160" r="220" fill="url(#orb_purple)">
    <animate attributeName="cy" values="160;100;160" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- 3. BLUEPRINT MESH GRID -->
  <rect width="1200" height="320" fill="url(#console_grid)"/>

  <!-- 4. CYBER CONSOLE FRAME -->
  <rect x="25" y="25" width="1150" height="270" rx="8" fill="url(#panel_glass)" stroke="url(#panel_border)" stroke-width="1.5"/>

  <!-- Corner Tech Details -->
  <!-- Top Left -->
  <path d="M 20 45 L 20 20 L 45 20" stroke="#00f2fe" stroke-width="3" fill="none"/>
  <line x1="20" y1="20" x2="35" y2="35" stroke="#00f2fe" stroke-width="1"/>
  <!-- Top Right -->
  <path d="M 1180 45 L 1180 20 L 1155 20" stroke="#00f2fe" stroke-width="3" fill="none"/>
  <line x1="1180" y1="20" x2="1165" y2="35" stroke="#00f2fe" stroke-width="1"/>
  <!-- Bottom Left -->
  <path d="M 20 275 L 20 300 L 45 300" stroke="#00f5a0" stroke-width="3" fill="none"/>
  <line x1="20" y1="300" x2="35" y2="285" stroke="#00f5a0" stroke-width="1"/>
  <!-- Bottom Right -->
  <path d="M 1180 275 L 1180 300 L 1155 300" stroke="#00f5a0" stroke-width="3" fill="none"/>
  <line x1="1180" y1="300" x2="1165" y2="285" stroke="#00f5a0" stroke-width="1"/>

  <!-- Telemetry Marks (+) -->
  <path d="M 100 50 M 95 50 L 105 50 M 100 45 L 100 55" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 1100 50 M 1095 50 L 1105 50 M 1100 45 L 1100 55" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 100 270 M 95 270 L 105 270 M 100 265 L 100 275" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 1100 270 M 1095 270 L 1105 270 M 1100 265 L 1100 275" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Top Console Header Bar -->
  <rect x="25" y="25" width="1150" height="30" rx="0" fill="#030712" fill-opacity="0.8" stroke="url(#panel_border)" stroke-width="1"/>
  <circle cx="45" cy="40" r="4" fill="#ff5f56"/>
  <circle cx="57" cy="40" r="4" fill="#ffbd2e"/>
  <circle cx="69" cy="40" r="4" fill="#27c93f"/>

  <!-- Telemetry System Stats -->
  <text x="95" y="44" font-family="monospace" font-size="10" fill="#8f9cae" letter-spacing="1">SYS_ST: <tspan fill="#00f5a0">ONLINE</tspan></text>
  <circle cx="190" cy="40" r="3.5" fill="#00f5a0" filter="url(#neon_glow_cyan)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="215" y="44" font-family="monospace" font-size="10" fill="#8f9cae" letter-spacing="1">LOC: <tspan fill="#58a6ff">IN_DL</tspan></text>
  <text x="315" y="44" font-family="monospace" font-size="10" fill="#8f9cae" letter-spacing="1">FPS: <tspan fill="#00f2fe">60</tspan></text>

  <text x="1145" y="44" font-family="monospace" font-size="10" fill="#00f2fe" text-anchor="end" letter-spacing="1">SH_SYS_v2.8.0</text>

  <!-- 5. CENTRAL BRANDING BLOCK -->
  <!-- Decorative Bracket Design -->
  <path d="M 380 150 L 350 150 L 350 110 Q 350 90 370 90 L 400 90" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 820 150 L 850 150 L 850 110 Q 850 90 830 90 L 800 90" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 380 190 L 350 190 L 350 230 Q 350 250 370 250 L 400 250" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M 820 190 L 850 190 L 850 230 Q 850 250 830 250 L 800 250" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

  <!-- Core Name -->
  <text x="600" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1" filter="url(#text_glow)">
    K. SHAIK ASHRAF
  </text>

  <!-- Role Subtitle -->
  <text x="600" y="180" font-family="monospace" font-size="13" font-weight="bold" fill="#00f2fe" text-anchor="middle" letter-spacing="4">
    SENIOR QA AUTOMATION ENGINEER // FRAMEWORK ARCHITECT
  </text>

  <!-- Flow / Process nodes (Center graph line) -->
  <line x1="420" y1="205" x2="780" y2="205" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="4,6" stroke-opacity="0.5"/>
  <circle cx="600" cy="205" r="4" fill="#9d4edd" filter="url(#neon_glow_cyan)"/>
  <circle cx="500" cy="205" r="3" fill="#00f2fe"/>
  <circle cx="700" cy="205" r="3" fill="#00f5a0"/>

  <!-- 6. HIGH-TECH METRIC BADGES -->
  <!-- Badge 1: Experience -->
  <g transform="translate(230, 235)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#0c101d" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="8" fill="#00f2fe" fill-opacity="0.15"/>
    <path d="M 17 17 L 23 17 M 20 14 L 20 20" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">5+ YRS EXP</text>
    <text x="110" y="21" font-family="monospace" font-size="9.5" fill="#8f9cae">[ACTIVE]</text>
  </g>

  <!-- Badge 2: ISTQB -->
  <g transform="translate(410, 235)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#0c101d" stroke="#9d4edd" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="8" fill="#9d4edd" fill-opacity="0.15"/>
    <path d="M 16 17 L 19 20 L 24 14" stroke="#9d4edd" stroke-width="1.8" fill="none"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">ISTQB® CTFL</text>
    <text x="120" y="21" font-family="monospace" font-size="9.5" fill="#8f9cae">[CERT]</text>
  </g>

  <!-- Badge 3: Healthcare -->
  <g transform="translate(590, 235)">
    <rect x="0" y="0" width="175" height="34" rx="17" fill="#0c101d" stroke="#00f5a0" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="8" fill="#00f5a0" fill-opacity="0.15"/>
    <!-- Heartbeat sign -->
    <path d="M 14 17 L 17 17 L 19 13 L 21 21 L 23 15 L 24 17 L 26 17" stroke="#00f5a0" stroke-width="1.5" fill="none"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">HEALTHCARE QA</text>
    <text x="135" y="21" font-family="monospace" font-size="9.5" fill="#8f9cae">[DOM]</text>
  </g>

  <!-- Badge 4: Automation -->
  <g transform="translate(785, 235)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#0c101d" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="8" fill="#58a6ff" fill-opacity="0.15"/>
    <circle cx="20" cy="17" r="4.5" stroke="#58a6ff" stroke-width="1.5" fill="none"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">AUTO ARCHITECT</text>
    <text x="145" y="21" font-family="monospace" font-size="9.5" fill="#8f9cae">[ROLE]</text>
  </g>
</svg>
