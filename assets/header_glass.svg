    <animate attributeName="opacity" values="0.45;0.70;0.45" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="600" cy="24" rx="190" ry="38" fill="#58A6FF" fill-opacity="0.055" filter="url(#orbBlur)"/>

  <rect x="90" y="24" width="1020" height="252" rx="20" fill="url(#glass)"/>

  <line x1="112" y1="24" x2="1088" y2="24" stroke="url(#topBorder)" stroke-width="1.6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </line>
  <line x1="112" y1="276" x2="1088" y2="276" stroke="url(#botBorder)" stroke-width="1"/>
  <line x1="90" y1="44"  x2="90"   y2="256" stroke="rgba(88,166,255,0.14)" stroke-width="1"/>
  <line x1="1110" y1="44" x2="1110" y2="256" stroke="rgba(138,43,226,0.14)" stroke-width="1"/>

