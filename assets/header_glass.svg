  <text x="320" y="223" text-anchor="middle" font-family="'Segoe UI Emoji','Segoe UI',system-ui" font-size="11.5" fill="#6FC3FF">&#x1F3E5; Healthcare</text>

  <rect x="395" y="204" width="112" height="28" rx="14" fill="rgba(0,200,83,0.10)" stroke="rgba(0,200,83,0.34)" stroke-width="1"/>
  <text x="451" y="223" text-anchor="middle" font-family="'Segoe UI Emoji','Segoe UI',system-ui" font-size="11.5" fill="#4DD68C">&#x26A1; 5+ Years</text>

  <rect x="520" y="204" width="112" height="28" rx="14" fill="rgba(255,215,0,0.08)" stroke="rgba(255,215,0,0.32)" stroke-width="1"/>
  <text x="576" y="223" text-anchor="middle" font-family="'Segoe UI Emoji','Segoe UI',system-ui" font-size="11.5" fill="#FFD700">&#x1F3C5; ISTQB&#xAE;</text>

